name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Build site
        run: python3 build.py
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://walletpartners.do' }}
      - name: Sanity checks
        run: |
          test -f site/index.html
          test -f site/stations/index.html
          test -f site/sitemap.xml
          grep -q "WP_STATIONS" site/stations/index.html
      - name: Check whether Cloudflare secrets are configured
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; build verified, deploy skipped."
          fi
      - name: Ensure the Pages project exists
        if: steps.cf.outputs.enabled == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: wallet-partners-dr
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          code=$(curl -sS -o /tmp/proj.json -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" "${api}/${PROJECT}")
          if [ "$code" = "404" ]; then
            echo "Creating Pages project ${PROJECT}"
            curl -sS -f -X POST -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"name\":\"${PROJECT}\",\"production_branch\":\"main\"}" "${api}" > /dev/null
          elif [ "$code" != "200" ]; then
            echo "Cloudflare API returned ${code}"; cat /tmp/proj.json; exit 1
          else
            echo "Pages project ${PROJECT} already exists"
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=wallet-partners-dr --branch=${{ github.ref_name }}
